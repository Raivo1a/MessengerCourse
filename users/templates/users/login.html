{% extends 'messenger/base.html' %}
{% block title %} Создание сообщения для рассылки {% endblock %}
{% block content %}
{% include 'messenger/header.html' %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Вход</h1>
</div>
<div class="container">
    <div class="row text-start">
        <div class="col-lg-3 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Введите логин и пароль</h4>
                </div>
                <div class="card-body">
                    <form method="post" class="form-floating">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Войти</button>
                        <a class="btn btn-primary" href="{% url 'users:password_reset' %}" role="button">Восстановить пароль</a>
                        <a class="btn btn-primary" href="{% url 'users:new_user_create' %}" role="button">Зарегистрироваться</a>
                        <a class="btn btn-primary" href="{% url 'messenger:home' %}" role="button">На главную</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
