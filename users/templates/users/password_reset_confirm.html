{% extends 'messenger/base.html' %}
{% block title %} Удаление профиля {% endblock %}
{% block content %}
{% include 'messenger/header.html' %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Создание нового пароля</h3>
                </div>
                <div class="card-body">

                        <p class="text-center mb-4">Пожалуйста, введите новый пароль дважды для подтверждения.</p>

                        <form method="POST">
                            {% csrf_token %}

                            <div class="form-group mb-3">
                                <label for="{{ form.new_password1.id_for_label }}">Новый пароль:</label>
                                <input
                                    type="password"
                                    name="new_password1"
                                    id="{{ form.new_password1.id_for_label }}"
                                    class="form-control"
                                    placeholder="Введите новый пароль"
                                    required
                                >
                            </div>

                            <div class="form-group mb-4">
                                <label for="{{ form.new_password2.id_for_label }}">Подтверждение пароля:</label>
                                <input
                                    type="password"
                                    name="new_password2"
                                    id="{{ form.new_password2.id_for_label }}"
                                    class="form-control"
                                    placeholder="Повторите новый пароль"
                                    required
                                >
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-key-fill"></i> Изменить пароль
                                </button>
                            </div>
                        </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
