{% extends 'messenger/base.html' %}
{% block title %} Создание рассылки {% endblock %}
{% block content %}
{% include 'messenger/header.html' %}
<form method="post" action="" class="form-floating" enctype="multipart/form-data">

</form>

{% endblock %}
